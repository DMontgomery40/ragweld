# Pre-commit hooks for tribrid-rag
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      # Validate TypeScript types match Pydantic
      - id: validate-types
        name: Validate TypeScript types match Pydantic
        entry: python scripts/validate_types.py
        language: python
        pass_filenames: false
        files: ^server/models/.*\.py$
        stages: [pre-commit]

      - id: jev-semantic-lint
        name: Jev semantic lint of staged source
        entry: python3 scripts/jev_lint.py --staged
        language: system
        pass_filenames: false
        files: \.(py|js|jsx|ts|tsx|json)$
        stages: [pre-commit]

      - id: contract-integrity
        name: Catalog and schema contract integrity
        entry: python scripts/check_contract_integrity.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
