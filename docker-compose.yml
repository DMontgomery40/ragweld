name: ragweld

services:
  postgres:
    # Default: pgvector/pgvector (dense vectors). For BM25 via ParadeDB pg_search:
    #   POSTGRES_IMAGE=paradedb/paradedb:latest
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    labels:
      io.ragweld.managed: "true"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tribrid_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    labels:
      io.ragweld.managed: "true"
    environment:
      # Prometheus exporter expects a Postgres DSN.
      # Use the same defaults as the postgres service.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tribrid_rag}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  neo4j:
    # Use Community by default; override for Enterprise multi-database:
    #   NEO4J_IMAGE=neo4j:5.26.20-enterprise
    #   NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    image: ${NEO4J_IMAGE:-neo4j:5.26.20-community}
    labels:
      io.ragweld.managed: "true"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      # Required for Enterprise. Safe to set even when using Community.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # Neo4j memory (important for large corpora). Defaults are conservative.
      # Tune via env if needed:
      #   NEO4J_HEAP_MAX=8G
      #   NEO4J_HEAP_INIT=4G
      #   NEO4J_PAGECACHE=4G
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INIT:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # The Neo4j image does not ship with curl; prefer cypher-shell.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1 AS ok;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana-oss:10.0.0
    labels:
      io.ragweld.managed: "true"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Allow embedding Grafana in an <iframe> (Grafana tab).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Anonymous auth for out-of-the-box, per-user-login-free embedding.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Consistent dark mode in embeds.
      GF_USERS_DEFAULT_THEME: dark
      # Required for cross-origin iframe cookies in some browsers.
      GF_SECURITY_COOKIE_SAMESITE: disabled
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3301}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v2.45.0
    labels:
      io.ragweld.managed: "true"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-59090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres-exporter
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_PORT:-53100}:3100"
    volumes:
      - ./infra/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    volumes:
      - ./infra/promtail-config.yml:/etc/promtail/config.yml:ro
      # Container discovery is filtered to the exact Ragweld project and ownership label.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mlflow:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v2.22.2}
    labels:
      io.ragweld.managed: "true"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-55500}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.17.1}
    labels:
      io.ragweld.managed: "true"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-56333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-56334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  flyte:
    # Flyte control plane (flyteadmin + propeller + console + minio + postgres on an
    # embedded k3s) for Learning Agent orchestration. Pinned to the Flyte v1.16.8
    # sandbox bundle; the host API talks to flyteadmin over HTTP on FLYTE_PORT.
    image: ${FLYTE_IMAGE:-cr.flyte.org/flyteorg/flyte-sandbox-bundled:sha-51877f899c9f95e0cb5efe90444eb0c6c6ea48a9}
    labels:
      io.ragweld.managed: "true"
    privileged: true
    environment:
      SANDBOX: "1"
      KUBERNETES_API_PORT: "30086"
      FLYTE_HOST: "localhost:30081"
      FLYTE_AWS_ENDPOINT: "http://localhost:30084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FLYTE_PORT:-30080}:30080"
      - "127.0.0.1:${FLYTE_MINIO_PORT:-30002}:30002"
    volumes:
      - flyte_storage:/var/lib/flyte/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:30080/healthcheck >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  vllm:
    image: vllm/vllm-openai-cpu:v0.26.0-arm64
    labels:
      io.ragweld.managed: "true"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - --served-model-name
      - ragweld-local
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.32"
    environment:
      # CPU backend memory budget: ~8 GiB bf16 weights for the 4B model + this KV cache (GiB).
      VLLM_CPU_KVCACHE_SPACE: "4"
    ports:
      - "127.0.0.1:${VLLM_PORT:-58080}:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  litellm:
    image: ghcr.io/berriai/litellm:v1.94.0
    labels:
      io.ragweld.managed: "true"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-ragweld-local}
    env_file:
      - ./infra/litellm.env.example
      - path: ./infra/litellm.env
        required: false
    ports:
      - "127.0.0.1:${LITELLM_PORT:-54000}:4000"
    volumes:
      - ./infra/litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:4000/v1/models', headers={'Authorization': 'Bearer ' + os.environ['LITELLM_MASTER_KEY']}); urllib.request.urlopen(request, timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      io.ragweld.managed: "true"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-ragweld-local}
      - VLLM_BASE_URL=http://vllm:8000/v1
      - OPENROUTER_API_KEY=
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SERVER_PORT:-58012}:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mlflow_data:
  qdrant_data:
  flyte_storage:
  neo4j_data:
  neo4j_logs:
  grafana_data:
  prometheus_data:
  loki_data:
  hf_cache:
