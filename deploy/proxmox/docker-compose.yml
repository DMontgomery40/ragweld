services:
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://ragweld-grafana.dtmont.com"

  alloy:
    environment:
      ALLOY_FARO_CORS_ORIGIN: "https://ragweld.dtmont.com"

  langfuse:
    env_file: !override
      - path: /etc/ragweld/langfuse.env
        required: false
    environment:
      NEXTAUTH_URL: "https://ragweld-langfuse.dtmont.com"
      AUTH_CUSTOM_CLIENT_ID: "langfuse"
      AUTH_CUSTOM_CLIENT_SECRET: "${LANGFUSE_OIDC_CLIENT_SECRET:?set LANGFUSE_OIDC_CLIENT_SECRET}"
      AUTH_CUSTOM_ISSUER: "https://ragweld-auth.dtmont.com"
      AUTH_CUSTOM_NAME: "Ragweld"
      AUTH_CUSTOM_SCOPE: "openid email profile groups"
      AUTH_CUSTOM_FETCH_USERINFO: "true"
      AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING: "true"
      AUTH_DISABLE_USERNAME_PASSWORD: "true"
      AUTH_DISABLE_SIGNUP: "true"

  authelia-redis:
    image: redis:7-alpine
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    # Started as root the redis entrypoint chowns /data to uid 999 and re-execs
    # under it, which would rewrite the owner of the bind mount and permanently
    # fail the owner-only preflight in start-runtime.sh. Running as the runtime
    # user that owns /etc/ragweld skips that branch entirely.
    user: "${RAGWELD_RUNTIME_UID:-1000}:${RAGWELD_RUNTIME_GID:-1000}"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - type: bind
        source: /etc/ragweld/authelia/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  authelia:
    image: authelia/authelia:4.39.20
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac
    ports:
      - "127.0.0.1:59091:9091"
    volumes:
      - ./deploy/proxmox/authelia/configuration.yml:/config/configuration.yml:ro
      - /etc/ragweld/authelia/users_database.yml:/config/users_database.yml:ro
      - /etc/ragweld/authelia/oidc-rsa.pem:/config/oidc-rsa.pem:ro
      - /etc/ragweld/authelia/langfuse-client-secret-digest:/etc/ragweld/authelia/langfuse-client-secret-digest:ro
      - /etc/ragweld/authelia/state:/state
    depends_on:
      authelia-redis:
        condition: service_healthy
    secrets:
      - authelia_session
      - authelia_storage
      - authelia_oidc_hmac

  caddy:
    image: caddy:2.11.4-alpine
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/proxmox/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
    depends_on:
      authelia:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    labels:
      io.ragweld.managed: "true"
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - /etc/ragweld/cloudflared:/etc/cloudflared:ro
    depends_on:
      caddy:
        condition: service_started

  langfuse-worker:
    env_file: !override
      - path: /etc/ragweld/langfuse.env
        required: false

  langfuse-postgres:
    environment:
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD}"

  langfuse-clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"

  langfuse-redis:
    environment:
      REDIS_AUTH: "${REDIS_AUTH:?set REDIS_AUTH}"
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?set REDIS_AUTH}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep PONG"]

  langfuse-minio:
    environment:
      MINIO_ROOT_USER: "${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:?set LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?set LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}"
      MINIO_ACCESS_KEY: "${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:?set LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}"
      MINIO_SECRET_KEY: "${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?set LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}"

secrets:
  authelia_session:
    file: /etc/ragweld/authelia/session-secret
  authelia_storage:
    file: /etc/ragweld/authelia/storage-encryption-key
  authelia_oidc_hmac:
    file: /etc/ragweld/authelia/oidc-hmac-secret
