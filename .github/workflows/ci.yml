name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  docs-ownership:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce docs ownership
        env:
          # check_docs_ownership.py diffs from this SHA on push events; GitHub
          # does not export it by itself (PRs use GITHUB_BASE_REF instead).
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/check_docs_ownership.py

  test-backend:
    runs-on: ubuntu-latest
    needs: [docs-ownership]

    services:
      neo4j:
        image: neo4j:5.26.20-community
        env:
          NEO4J_AUTH: neo4j/ci-fixture-only
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
          NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-fixture-only 'RETURN gds.version(), apoc.version()'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --memory 3g

      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 56333:6333

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tribrid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # Docling's real PDF tests must not depend on mutable HF main revisions or
      # model download rate limits during conversion. Cache only verified assets.
      - name: Restore Docling model artifacts
        id: docling-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ragweld-docling-models
          key: docling-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/docling_ci_models.json', 'scripts/prepare_docling_ci.py') }}

      - name: Provision and verify pinned Docling models
        run: uv run python scripts/prepare_docling_ci.py --artifacts-path "${{ runner.temp }}/ragweld-docling-models"

      # Save after verification, even when a later test fails. Partial downloads
      # never enter this cache, and every restored file is checked again above.
      - name: Save verified Docling model artifacts
        if: steps.docling-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ragweld-docling-models
          key: ${{ steps.docling-cache.outputs.cache-primary-key }}

      - name: Run linting
        run: uv run ruff check server

      - name: Run type checking
        run: uv run mypy server

      - name: Config Reality Check
        run: uv run scripts/check_config_reality.py

      - name: Contract Bundle Check
        run: uv run scripts/validate_contract_bundle.py

      - name: Prepare integration dependencies
        run: |
          cp .env.example .env
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:56333/readyz

      - name: Run tests
        env:
          DOCLING_ARTIFACTS_PATH: ${{ runner.temp }}/ragweld-docling-models
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tribrid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          RAGWELD_NATIVE_LEDGER_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/tribrid_test
          QDRANT_URL: http://127.0.0.1:56333
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-fixture-only
        run: uv run pytest tests/ -v --cov=server

  test-frontend:
    runs-on: ubuntu-latest
    needs: [docs-ownership]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linting
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tribrid-rag:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d --name test-container tribrid-rag:${{ github.sha }}
          sleep 10
          docker logs test-container
          docker stop test-container
