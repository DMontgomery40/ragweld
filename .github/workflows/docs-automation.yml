name: Docs Autopilot (push)
on:
  push:
    branches: ["main", "development"]
    paths:
      - "server/**"
      - "web/**"
      - "scripts/docs_ai/**"
      - "scripts/generate_config_reference_docs.py"
      - "data/models.json"
      - "data/glossary.json"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "start.sh"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff against (default: previous push SHA). Use EMPTY for a full bootstrap (empty-tree → HEAD)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: docs-autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-autopilot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # OpenAI model used by scripts/docs_ai/generate_docs_from_diff.py (Responses API)
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies (uv)
        run: uv sync --frozen

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install mkdocs==1.6.1 mkdocs-material==9.7.1 pymdown-extensions==10.7.1
          pip install mike==2.1.0 mkdocs-git-revision-date-localized-plugin==1.2.6 mkdocs-minify-plugin==0.8.0
          pip install mkdocs-glightbox

      - name: Run docs autopilot
        run: |
          python scripts/docs_ai/run_ci_autopilot.py --base "${{ github.event.inputs.base_ref }}"

      - name: Upload docs autopilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-docs-autopilot
          path: |
            mkdocs-docs-plan.md
            mkdocs-docs-llm.patch
            output/docs-autopilot/**
          if-no-files-found: ignore
