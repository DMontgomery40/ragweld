name: Docs Autopilot (push)
on:
  push:
    branches: ["main", "development"]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff against (default: previous push SHA). Use EMPTY for a full bootstrap (empty-tree → HEAD)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: docs-autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-autopilot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # OpenAI model used by scripts/docs_ai/generate_docs_from_diff.py (Responses API)
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project dependencies (uv)
        run: uv sync --frozen

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install mkdocs==1.6.1 mkdocs-material==9.7.1 pymdown-extensions==10.7.1
          pip install mike==2.1.0 mkdocs-git-revision-date-localized-plugin==1.2.6 mkdocs-minify-plugin==0.8.0
          pip install mkdocs-glightbox

      - name: Generate docs plan (artifact)
        run: |
          BASE="${{ github.event.inputs.base_ref }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/${{ github.ref_name }}"
          fi
          echo "Using base ref: $BASE"
          python scripts/docs_ai/generate_docs_from_diff.py --base "$BASE" --output mkdocs-docs-plan.md

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-docs-plan
          path: mkdocs-docs-plan.md

      - name: Require OPENAI_API_KEY
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "ERROR: OPENAI_API_KEY is not set."
            echo "Add it in GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Generate docs patch (apply)
        id: docs_patch
        continue-on-error: true
        run: |
          BASE="${{ github.event.inputs.base_ref }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/${{ github.ref_name }}"
          fi
          echo "Using base ref: $BASE"
          python scripts/docs_ai/generate_docs_from_diff.py --base "$BASE" --llm openai --apply

      - name: Docs autopilot failed
        if: steps.docs_patch.outcome == 'failure'
        run: |
          echo "## Docs Autopilot Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The LLM-generated patch could not be applied (often due to corrupt or incompatible patch format)." >> $GITHUB_STEP_SUMMARY
          echo "Check the **Generate docs patch (apply)** step log for \`::error::\` annotations and full details." >> $GITHUB_STEP_SUMMARY
          echo "The patch artifact (mkdocs-docs-llm-patch) may be downloaded for inspection." >> $GITHUB_STEP_SUMMARY
          echo "The workflow will continue with config reference generation and docs build so this best-effort failure does not block main." >> $GITHUB_STEP_SUMMARY

      - name: Generate config reference docs (Pydantic + glossary)
        run: |
          uv run python scripts/generate_config_reference_docs.py --clean
          git add mkdocs/docs/reference/config

      - name: Upload patch (best-effort)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-docs-llm-patch
          path: mkdocs-docs-llm.patch
          if-no-files-found: ignore

      - name: Build documentation
        run: mkdocs build --strict

      - name: Commit and push docs updates
        run: |
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ai): autopilot update"
          git push origin HEAD:${{ github.ref_name }}
