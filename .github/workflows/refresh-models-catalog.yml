name: Refresh Models Catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-models-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh models catalog
        run: uv run python scripts/refresh_models_catalog.py --apply

      - name: Run banned checks
        run: uv run scripts/check_banned.py

      - name: Commit and push catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/models.json web/public/models.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi

          git commit -m "chore(models): daily catalog refresh"
          git push origin HEAD:${{ github.ref_name }}
