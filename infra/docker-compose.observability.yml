version: '3.8'

# Lightweight observability overlay for local development.
# Usage:
#   docker compose -f docker-compose.yml -f infra/docker-compose.observability.yml up -d grafana tempo alloy

services:
  tempo:
    image: grafana/tempo:2.7.2
    container_name: tribrid-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/tmp/tempo

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: tribrid-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
      - "4319:4317"
      - "4320:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - tempo

volumes:
  tempo_data:
