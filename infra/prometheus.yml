global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Long-range retention: forward every WAL sample (scrapes plus Tempo's
# span metrics received over the remote-write receiver) to Mimir.
remote_write:
  - url: http://mimir:9009/api/v1/push

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------
  # Ragweld API (FastAPI)
  # ----------------------------
  # Canonical development flow: backend runs on the host on a namespaced port.
  - job_name: 'ragweld-api-host'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:58012']
        labels:
          service: 'ragweld-api'
          mode: 'host'

  # ----------------------------
  # Postgres (pgvector) via exporter
  # ----------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ----------------------------
  # Generation gateway + serving
  # ----------------------------
  - job_name: 'litellm'
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']

  # The local-model server (vllm-metal) runs on the host, not in the VM, and only
  # when the launcher runs that lane. Its target is discovered from a file the
  # launcher writes while the lane runs (scripts/runtime_lifecycle.sh); a runtime
  # without the lane (production: --no-local-model, chat.vllm.enabled=false) has
  # no target, so no `up{job="vllm"}` series and no RagweldLocalModelDown.
  - job_name: 'vllm'
    metrics_path: /metrics
    file_sd_configs:
      - files: ['/etc/prometheus/targets/vllm.json']

  # Laya, the local/offline System One provider, always runs beside the platform (it is
  # started best-effort, outside the boot `--wait` set), so it is scraped statically: a
  # down Laya is visible whichever provider is selected. RagweldLayaDown only fires while
  # Ragweld is actually sending it traffic (see infra/prometheus-rules.yml).
  - job_name: 'laya'
    metrics_path: /metrics
    static_configs:
      - targets: ['laya:8000']
