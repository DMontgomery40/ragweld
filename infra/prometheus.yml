global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------
  # Ragweld API (FastAPI)
  # ----------------------------
  # Canonical development flow: backend runs on the host on a namespaced port.
  - job_name: 'ragweld-api-host'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:58012']
        labels:
          service: 'ragweld-api'
          mode: 'host'

  # ----------------------------
  # Postgres (pgvector) via exporter
  # ----------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
