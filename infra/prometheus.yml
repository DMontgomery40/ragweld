global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Long-range retention: forward every WAL sample (scrapes plus Tempo's
# span metrics received over the remote-write receiver) to Mimir.
remote_write:
  - url: http://mimir:9009/api/v1/push

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------
  # Ragweld API (FastAPI)
  # ----------------------------
  # Canonical development flow: backend runs on the host on a namespaced port.
  - job_name: 'ragweld-api-host'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:58012']
        labels:
          service: 'ragweld-api'
          mode: 'host'

  # ----------------------------
  # Postgres (pgvector) via exporter
  # ----------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ----------------------------
  # Generation gateway + serving
  # ----------------------------
  - job_name: 'litellm'
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']

  - job_name: 'vllm'
    metrics_path: /metrics
    static_configs:
      # The local-model server (vllm-metal) runs on the host, not in the VM.
      - targets: ['host.docker.internal:58080']
