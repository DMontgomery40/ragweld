server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - '__meta_docker_container_label_com_docker_compose_project'
          - '__meta_docker_container_label_io_ragweld_managed'
        separator: ';'
        regex: 'ragweld;true'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # Shared service label across container logs (promtail) and host-process
      # logs (OTLP via Alloy) so one LogQL selector covers both runtimes.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'ragweld_service'
      - target_label: 'deployment_runtime'
        replacement: 'container'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: timestamp
      - labels:
          level:
          stream:
