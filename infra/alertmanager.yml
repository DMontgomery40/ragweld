# Receivers are intentionally EMPTY in the dev overlay: alerts are aggregated,
# grouped, and inhibited here (and visible via /api/v2/alerts + the workbench
# incident feed), but no webhook/email/pager delivery is configured. Wiring a
# real notification channel is an operator decision that needs credentials —
# add them to the receivers below; do not assume paging exists because this
# service is healthy.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
  - name: 'critical'
  - name: 'warning'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
