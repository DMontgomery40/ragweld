# Alert delivery. Every Ragweld alert goes to Discord except the always-firing
# RagweldWatchdog, which is parked on a receiver with no integration (its presence
# in /api/v2/alerts is what proves the pipe; paging on it would be noise).
#
# Webhook URLs are secrets and never live in this file, the repo, or a log:
# - Discord: /etc/ragweld/alertmanager-discord-webhook (0600, owned by the runtime
#   user) on the Proxmox host, mounted read-only at the same path by
#   deploy/proxmox/docker-compose.yml and required by start-runtime.sh.
# - The local dev overlay mounts no webhook, so the discord receiver fails at send
#   time there (logged by Alertmanager, nothing leaves the machine).
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord'
  routes:
    - matchers: ['alertname="RagweldWatchdog"']
      receiver: 'null'

receivers:
  - name: 'null'
  - name: 'discord'
    discord_configs:
      - webhook_url_file: /etc/ragweld/alertmanager-discord-webhook
        send_resolved: true
  # Slack, ready but NOT routed. To switch it on: put the incoming-webhook URL in
  # /etc/ragweld/alertmanager-slack-webhook (0600, runtime user), add its read-only
  # mount beside the Discord one in deploy/proxmox/docker-compose.yml, then set
  # `receiver: 'slack'` on the route above (or add a route that matches what should
  # go to Slack).
  - name: 'slack'
    slack_configs:
      - api_url_file: /etc/ragweld/alertmanager-slack-webhook
        send_resolved: true

inhibit_rules:
  # A critical alert silences the matching warning for the same alert and instance.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'instance']
