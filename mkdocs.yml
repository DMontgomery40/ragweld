site_name: ragweld Docs
site_description: Tri-brid Retrieval-Augmented Generation (Vector + Sparse + Graph) — product docs for ragweld
site_url: https://dmontgomery40.github.io/ragweld/
repo_url: https://github.com/DMontgomery40/ragweld
repo_name: DMontgomery40/ragweld
edit_uri: edit/main/mkdocs/docs/
copyright: Copyright &copy; 2026 ragweld
docs_dir: mkdocs/docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - search.share
  icon:
    logo: material/vector-combine
    repo: fontawesome/brands/github
    admonition:
      note: material/note-text
      info: material/information
      tip: material/lightbulb
      success: material/check-circle
      warning: material/alert
      danger: material/alert-circle

plugins:
  - search
  - mike
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_datetime
      strict: false
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DMontgomery40/ragweld
  version:
    provider: mike
    default: latest

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid-init.js

nav:
  - Home: index.md
  - User Manual:
      - Overview: manual/index.md
      - Quickstart: manual/quickstart.md
      - Native Postgres (macOS): manual/native_postgres.md
      - Indexing a corpus: manual/indexing.md
      - Searching & answering: manual/search.md
      - UI tour: manual/ui.md
      - Troubleshooting: manual/troubleshooting.md
  - Concepts:
      - Architecture: architecture.md
      - Retrieval overview: retrieval/overview.md
      - Indexing pipeline: indexing.md
      - Corpus vs repo_id: guides/corpus.md
  - Reference:
      - Config API & workflow: configuration.md
      - Config reference:
          - Overview: reference/config/index.md
          - retrieval: reference/config/retrieval.md
          - scoring: reference/config/scoring.md
          - layer_bonus: reference/config/layer_bonus.md
          - embedding: reference/config/embedding.md
          - tokenization: reference/config/tokenization.md
          - chunking: reference/config/chunking.md
          - indexing: reference/config/indexing.md
          - graph_storage: reference/config/graph_storage.md
          - graph_indexing: reference/config/graph_indexing.md
          - fusion: reference/config/fusion.md
          - vector_search: reference/config/vector_search.md
          - sparse_search: reference/config/sparse_search.md
          - graph_search: reference/config/graph_search.md
          - reranking: reference/config/reranking.md
          - generation: reference/config/generation.md
          - enrichment: reference/config/enrichment.md
          - chunk_summaries: reference/config/chunk_summaries.md
          - keywords: reference/config/keywords.md
          - tracing: reference/config/tracing.md
          - training: reference/config/training.md
          - ui: reference/config/ui.md
          - chat: reference/config/chat.md
          - hydration: reference/config/hydration.md
          - evaluation: reference/config/evaluation.md
          - system_prompts: reference/config/system_prompts.md
          - mcp: reference/config/mcp.md
          - docker: reference/config/docker.md
      - API: api.md
      - Models: models.md
      - Glossary: glossary.md
  - Operations:
      - Deployment: deployment.md
      - Operations & metrics: operations.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
  - Developer:
      - Dev workflow: dev_workflow.md
      - Docs Autopilot: dev/docs-autopilot.md
      - Pydantic: dev/pydantic.md
      - Frontend: frontend.md
      - Testing: testing.md
      - Observability: observability.md

