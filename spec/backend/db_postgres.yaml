name: Postgres Client
description: PostgreSQL control/state client (corpus registry, chunk rows, summaries, caches; vectors live in Qdrant)
version: "2.0"

class: PostgresClient

methods:
  - name: connect
    async: true
    description: Connect to PostgreSQL (ensures schema; drops legacy vector/FTS columns on upgrade)

  - name: disconnect
    async: true
    description: Disconnect from PostgreSQL

  - name: upsert_chunks
    async: true
    params:
      - repo_id: str
      - chunks: list[Chunk]
    returns: int
    description: Upsert chunk rows (content + provenance, no vectors) and stamp corpora.last_indexed

  - name: count_chunks
    async: true
    params:
      - repo_id: str
    returns: int
    description: Number of chunk rows for a corpus

  - name: update_corpus_embedding_meta
    async: true
    params:
      - repo_id: str
      - backend: str
      - provider: str
      - model: str
      - dimensions: int
      - sparse_contract: dict | None
    returns: None
    description: Record the dense and sparse index contracts on the corpus row

  - name: clear_corpus_index_state
    async: true
    params:
      - repo_id: str
    returns: None
    description: Reset last_indexed and contracts after chunks/vectors were deleted

  - name: get_chunk
    async: true
    params:
      - chunk_id: str
    returns: Chunk | None
    description: Get chunk by ID

  - name: get_index_stats
    async: true
    params:
      - repo_id: str
    returns: IndexStats
    description: Get index statistics
