name: Reranker
description: Multi-mode reranking
version: "1.0"

class: Reranker

config: RerankerConfig

modes:
  - none: No reranking (passthrough)
  - learning: MLX Qwen3 LoRA learning reranker (adapter-based)
  - cloud: External reranking API (Cohere/Voyage/Jina)

methods:
  - name: rerank
    async: true
    params:
      - query: str
      - chunks: list[ChunkMatch]
    returns: list[ChunkMatch]
    description: Rerank chunks for query

  - name: _rerank_trained
    async: true
    params:
      - query: str
      - chunks: list[ChunkMatch]
    returns: list[ChunkMatch]
    description: Learning reranker scoring (MLX Qwen3 adapter)

  - name: _rerank_api
    async: true
    params:
      - query: str
      - chunks: list[ChunkMatch]
    returns: list[ChunkMatch]
    description: Cloud API-based reranking
