name: Benchmark API
description: Multi-model benchmark runs with quality-loop lineage attachment
version: "1.0"

endpoints:
  - path: /api/benchmark/run
    method: POST
    request: BenchmarkRunRequest
    response: BenchmarkRun
    description: Run the same prompt against multiple models and persist a typed benchmark record.

  - path: /api/benchmark/results
    method: GET
    response: BenchmarkRunsResponse
    description: List recent benchmark runs, optionally scoped to the active corpus.

models:
  BenchmarkRunRequest:
    prompt: str
    models: list[str]

  BenchmarkResult:
    model: str
    response: str
    latency_ms: float
    error: str | None

  BenchmarkRun:
    run_id: str
    repo_id: str | None
    prompt: str
    models: list[str]
    input_bundle_id: str | None
    bundle_id: str | None
    lineage_ref: LineageRef | None
